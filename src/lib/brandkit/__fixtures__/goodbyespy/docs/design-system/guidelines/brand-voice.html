<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="../styles.css" />
        <style>
            body {
                padding: 20px 28px;
                box-sizing: border-box;
                display: flex;
                gap: 24px;
            }
            .col {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .tag {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: var(--tracking-caps);
                font-weight: 700;
            }
            .q {
                font-size: 14px;
                line-height: 1.5;
                padding: 10px 14px;
                border-radius: var(--radius-md);
            }
        </style>
    </head>
    <body>
        <div class="col">
            <span class="tag" style="color: var(--green-700)">Say</span>
            <div class="q" style="background: var(--green-100); color: var(--green-950)">
                “Wondering why you need a subscription for data removal? Us too.”
            </div>
            <div class="q" style="background: var(--green-100); color: var(--green-950)">
                “No subscriptions, no surprises.”
            </div>
        </div>
        <div class="col">
            <span class="tag" style="color: var(--status-danger)">Avoid</span>
            <div class="q" style="background: var(--status-danger-bg); color: var(--status-danger)">
                “Revolutionary AI-powered privacy solution!!” — hype, exclamation marks
            </div>
            <div class="q" style="background: var(--status-danger-bg); color: var(--status-danger)">
                Fearmongering, emoji, Title Case Buttons
            </div>
        </div>
    </body>
</html>
